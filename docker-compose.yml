services:
  mysql:
    image: mysql:8.0
    container_name: smartcity-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: smart_city_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./oauth-server/schema.sql:/docker-entrypoint-initdb.d/02-oauth.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smartcity-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartcity-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcity-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartcity-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL","pidof mosquitto || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartcity-net

  node-red:
    image: nodered/node-red:latest
    container_name: smartcity-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - NODE_RED_ENABLE_SAFE_MODE=false
    volumes:
      - node-red-data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - smartcity-net

  express-gateway:
    build: ./express-gateway
    container_name: smartcity-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"

    environment:
      JWT_SECRET: ${JWT_SECRET:-smartcity-secret-key}
      OAUTH_SERVER_URL: http://oauth-server:3002
      CITIZEN_SERVICE_URL: http://php-citizen
      TRAFFIC_SERVICE_URL: http://php-traffic
      PYTHON_ML_URL: http://python-ml:5000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {r.statusCode===200?process.exit(0):process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smartcity-net

  oauth-server:
    build: ./oauth-server
    container_name: smartcity-oauth
    restart: unless-stopped

    ports:
      - "3002:3002"

    environment:
      JWT_SECRET: ${JWT_SECRET:-smartcity-secret-key}
      JWT_ACCESS_EXPIRATION: 1h
      JWT_REFRESH_EXPIRATION: 7d

      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      DB_NAME: smart_crowd_auth

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - smartcity-net


  php-citizen:
    build: ./php-citizen
    container_name: smartcity-citizen
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: smart_city_db
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD","curl","-f","http://localhost/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smartcity-net

  php-traffic:
    build: ./php-traffic
    container_name: smartcity-traffic
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: smart_city_db
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD","curl","-f","http://localhost/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smartcity-net

  python-ml:
    build: ./python-ml-service
    container_name: smartcity-ml
    restart: unless-stopped
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').status==200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smartcity-net

  prometheus:
    image: prom/prometheus:latest
    container_name: smartcity-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - smartcity-net

  grafana:
    image: grafana/grafana:latest
    container_name: smartcity-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - smartcity-net

networks:
  smartcity-net:
    driver: bridge
    name: smartcity-net

volumes:
  mysql-data:
    name: mysql-data
  rabbitmq-data:
    name: rabbitmq-data
  node-red-data:
    name: node-red-data
  prometheus-data:
    name: prometheus-data
  grafana-data:
    name: grafana-data