services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: city-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PUBLIC_PORT:-1884}:1883"
    environment:
      MQTT_USERNAME: iot_device
      MQTT_PASSWORD: iot_secret
    volumes:
      - ./mosquitto/conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/scripts/entrypoint.sh:/mosquitto-entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    entrypoint: ["/bin/sh", "/mosquitto-entrypoint.sh"]

  node-red:
    image: nodered/node-red:latest
    container_name: city-node-red
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "1880:1880"
    environment:
      FLOWS: flows.json
    volumes:
      - ./node-red/data:/data

volumes:
  mosquitto_data:
  mosquitto_log:
