per_listener_settings false

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/passwords

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Topic convention:
# city/{zone}/crowd        Crowd density and movement data per zone
# city/{zone}/security     Security status per zone
# city/{zone}/environment  Temperature, humidity, and visibility per zone
